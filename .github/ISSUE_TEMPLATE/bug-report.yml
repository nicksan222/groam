name: Bug report
description: Report reproducible behavior that is not working as expected
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Groam. Search existing issues before filing a new report, and do not include secrets or security vulnerabilities here.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen?
      options:
        - Web app
        - Desktop app
        - Local development
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the desktop version, deployed version, or commit SHA when known.
      placeholder: v0.1.0 or abc1234
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your operating system and, for web issues, browser and browser version.
      placeholder: Ubuntu 24.04, Firefox 142
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest sequence that consistently demonstrates the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove API keys, tokens, personal data, and other sensitive information before posting.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or anything else that may help reproduce or diagnose the issue.
