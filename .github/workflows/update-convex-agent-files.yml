name: Update Convex agent files

on:
  schedule:
    # Monday at 05:37 UTC; offset from the hour to reduce scheduler congestion.
    - cron: '37 5 * * 1'
  workflow_dispatch:

concurrency:
  group: update-convex-agent-files
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update files and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Update Convex agent files
        run: just update-convex-agent-files

      - name: Create or update pull request
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.AUTOMATION_TOKEN }}
          branch: automation/update-convex-agent-files
          commit-message: 'chore: update Convex agent files'
          delete-branch: true
          title: 'chore: update Convex agent files'
          body: |
            ## Summary

            - Refresh the Convex-managed agent guidelines and skills.
            - Keep Groam coding agents aligned with the latest Convex guidance.

            ## Validation

            - `just update-convex-agent-files`

      - name: Enable auto-merge
        if: steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: just enable-pr-auto-merge ${{ steps.pull-request.outputs.pull-request-number }}
