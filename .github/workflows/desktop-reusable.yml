name: Desktop

on:
  workflow_call:
    inputs:
      platform:
        description: Artifact suffix, such as linux, macos-arm, or windows.
        required: true
        type: string
      runner:
        required: true
        type: string
      target:
        description: Rust target triple.
        required: true
        type: string
      bundles:
        description: Comma-separated Tauri bundle kinds.
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ inputs.target }}

      # Dependencies dominate the release build; keep the bundles themselves out of the cache.
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/desktop/src-tauri/target/
            !apps/desktop/src-tauri/target/*/release/bundle/
          key: rust-${{ inputs.target }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ inputs.target }}-

      - name: Install Linux desktop dependencies
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xdg-utils

      - name: Stamp release version
        run: bun apps/desktop/scripts/updater-release.ts stamp "${{ github.run_number }}"

      - name: Build frontend assets for desktop
        shell: bash
        run: |
          bun run codegen:routes
          bun run codegen:auth
          bun run build:web:desktop
          bun apps/desktop/scripts/stage-resources.ts
          bun apps/desktop/scripts/prepare-binaries.ts --required --target "${{ inputs.target }}"
          bun run --cwd apps/desktop build

      - name: Build desktop app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # linuxdeploy needs this on modern runners; NO_STRIP avoids strip
          # crashing on the statically linked bun sidecar.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          set -euo pipefail
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=
          bundles="${{ inputs.bundles }}"
          args=(--ci --verbose --target "${{ inputs.target }}")
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          args+=(--bundles "$bundles")
          bun run --cwd apps/desktop tauri build "${args[@]}"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: groam-desktop-${{ inputs.platform }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/desktop-version.txt
            apps/desktop/src-tauri/target/${{ inputs.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ inputs.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ inputs.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ inputs.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ inputs.target }}/release/bundle/**/*.sig
