name: Test

on:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fallow's hotspot analysis reads git history.
          fetch-depth: 0
          persist-credentials: false

      - name: Lint GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          "${RUNNER_TEMP}/actionlint"

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Lint
        run: bun run lint

      - name: Audit dependencies
        run: bun run audit

      - name: React Doctor
        run: bun run react-doctor

      - name: Dead code
        run: bun run fallow

  typecheck:
    name: 🔷 Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Typecheck
        run: bun run typecheck

  unit:
    name: 🧪 Unit tests
    needs: [lint, typecheck]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Backend, tooling, and package tests
        run: bun run test:packages

  web:
    name: 🌐 Web tests
    needs: [lint, typecheck]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Setup Chromium
        uses: ./.github/actions/setup-chromium

      - name: Web unit and view tests
        run: bun run test:web

  ui:
    name: 🧩 UI tests
    needs: [lint, typecheck]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Setup Chromium
        uses: ./.github/actions/setup-chromium

      - name: UI, assistant, and auth tests
        run: bun run test:ui

  journeys:
    name: 🎭 Journeys
    needs: [lint, typecheck]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      CONVEX_AGENT_MODE: anonymous
      STATIC_SITE_URL: http://localhost:3211
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Setup Chromium
        uses: ./.github/actions/setup-chromium

      - name: Start local Convex backend
        shell: bash
        run: |
          set -euo pipefail
          bunx convex dev --typecheck-components --tail-logs disable > /tmp/convex.log 2>&1 &
          echo "$!" > /tmp/convex.pid
          timeout 600 bash -c '
            until [ -f .env.local ] && bunx convex run --component web lib:getUrls "{}" >/dev/null 2>&1; do
              sleep 2
            done
          '

      # The same auth setup as local dev: a secret and the Vite site the passkey rpID comes from.
      - name: Configure auth
        run: bun tooling/devkit/configure-auth.ts

      - name: Verify generated code
        run: |
          bun run codegen
          git diff --exit-code

      # A failing journey keeps its Playwright trace (network, console, DOM) in the failure artifact.
      - name: Journeys
        run: bun run test:journeys -- --browser.trace=retain-on-failure

      # The production build: published to the local static host and smoke-tested.
      - name: Publish local static sites
        run: bun run hosting:upload:web

      - name: Verify static routes
        shell: bash
        run: |
          curl --fail --show-error --silent "$STATIC_SITE_URL/" >/dev/null
          curl --fail --show-error --silent "$STATIC_SITE_URL/settings" >/dev/null
          test "$(curl --output /dev/null --silent --write-out '%{http_code}' "$STATIC_SITE_URL/missing.js")" = "404"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-failure-${{ github.run_id }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            /tmp/convex.log
            apps/web/.vitest/

      - name: Stop local Convex backend
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/convex.pid ]; then
            kill "$(cat /tmp/convex.pid)" 2>/dev/null || true
          fi

  # Portable Linux bundles build against the oldest supported glibc baseline
  # instead of following ubuntu-latest image rollouts.
  desktop-linux:
    name: 🐧 Desktop
    needs: [unit, web, ui, journeys]
    uses: ./.github/workflows/desktop-reusable.yml
    with:
      platform: linux
      runner: ubuntu-22.04
      target: x86_64-unknown-linux-gnu
      bundles: deb
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  desktop-macos:
    name: 🍎 Desktop
    needs: [unit, web, ui, journeys]
    uses: ./.github/workflows/desktop-reusable.yml
    with:
      platform: macos-arm
      runner: macos-26
      target: aarch64-apple-darwin
      bundles: app,dmg
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  desktop-windows:
    name: 🪟 Desktop
    needs: [unit, web, ui, journeys]
    uses: ./.github/workflows/desktop-reusable.yml
    with:
      platform: windows
      runner: windows-2025
      target: x86_64-pc-windows-msvc
      bundles: nsis
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
