name: Test

on:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          "${RUNNER_TEMP}/actionlint"

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Lint
        run: bun run lint

      - name: Audit dependencies
        run: bun run audit

      - name: React Doctor
        run: bun run react-doctor

      - name: Dead code
        run: bun run fallow

  typecheck:
    name: 🔷 Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Typecheck
        run: bun run typecheck

  unit:
    name: 🧪 Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Setup Chromium
        uses: ./.github/actions/setup-chromium

      - name: Unit tests
        run: bun run test

      - name: Showcase recording
        run: bun run --cwd tooling/showcase test:browser

  journeys:
    name: 🎭 Journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      CONVEX_AGENT_MODE: anonymous
      STATIC_SITE_URL: http://localhost:3211
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Setup Chromium
        uses: ./.github/actions/setup-chromium

      - name: Start local Convex backend
        shell: bash
        run: |
          set -euo pipefail
          bunx convex dev --typecheck-components --tail-logs disable > /tmp/convex.log 2>&1 &
          echo "$!" > /tmp/convex.pid
          timeout 600 bash -c '
            until [ -f .env.local ] && bunx convex run --component web lib:getUrls "{}" >/dev/null 2>&1; do
              sleep 2
            done
          '

      # The same auth setup as local dev: a secret and the Vite site the passkey rpID comes from.
      - name: Configure auth
        run: bun tooling/devkit/configure-auth.ts

      - name: Verify generated code
        run: |
          bun run codegen
          git diff --exit-code

      - name: Run pending migrations
        run: bun run migrations:run

      - name: Journeys
        run: bun run test:journeys

      # The production build: published to the local static host and smoke-tested.
      - name: Publish local static sites
        run: bun run hosting:upload:web

      - name: Verify static routes
        shell: bash
        run: |
          curl --fail --show-error --silent "$STATIC_SITE_URL/" >/dev/null
          curl --fail --show-error --silent "$STATIC_SITE_URL/settings" >/dev/null
          test "$(curl --output /dev/null --silent --write-out '%{http_code}' "$STATIC_SITE_URL/missing.js")" = "404"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-failure-${{ github.run_id }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            /tmp/convex.log
            apps/web/.vitest/

      - name: Stop local Convex backend
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/convex.pid ]; then
            kill "$(cat /tmp/convex.pid)" 2>/dev/null || true
          fi

  desktop:
    name: 🖥️ Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CI: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            # Build portable Linux bundles against the oldest supported glibc
            # baseline instead of following ubuntu-latest image rollouts.
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - platform: macos-arm
            runner: macos-26
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xdg-utils

      - name: Stamp release version
        run: bun apps/desktop/scripts/updater-release.ts stamp "${{ github.run_number }}"

      - name: Build frontend assets for desktop
        shell: bash
        run: |
          bun run codegen:routes
          bun run codegen:auth
          bun run build:web:desktop
          bun apps/desktop/scripts/stage-resources.ts
          bun apps/desktop/scripts/prepare-binaries.ts --required --target "${{ matrix.target }}"
          bun run --cwd apps/desktop build

      - name: Build desktop app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # linuxdeploy needs this on modern runners; NO_STRIP avoids strip
          # crashing on the statically linked bun sidecar.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          set -euo pipefail
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=
          bundles="${{ matrix.bundles }}"
          args=(--ci --verbose --target "${{ matrix.target }}")
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          args+=(--bundles "$bundles")
          bun run --cwd apps/desktop tauri build "${args[@]}"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: groam-desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/desktop-version.txt
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
