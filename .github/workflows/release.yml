name: Release

on:
  # Temporary branch-only trigger used to prove the signed release path before merge.
  push:
    branches: [fix/weekly-github-release]
  schedule:
    # Monday at 06:17 UTC; offset from the hour to reduce scheduler congestion.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "release" to confirm publication
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    steps:
      - name: Validate source and signing key
        env:
          CONFIRM: ${{ inputs.confirm }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "push" ] && [ "$REF" != "refs/heads/main" ]; then
            echo '::error::Releases must run from main.'
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$CONFIRM" != "release" ]; then
            echo '::error::Type "release" in the confirmation input to publish a release.'
            exit 1
          fi
          if [ -z "$SIGNING_PRIVATE_KEY" ]; then
            echo '::error::TAURI_SIGNING_PRIVATE_KEY is not configured.'
            exit 1
          fi

  build:
    name: Build and verify release
    needs: [validate]
    uses: ./.github/workflows/test-reusable.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  prepare:
    name: Prepare GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'

      - name: Download desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: desktop-artifacts
          pattern: groam-desktop-*

      - name: Prepare release assets
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          version="$(tr -d '[:space:]' < desktop-artifacts/desktop-version.txt)"
          tag="v${version}"
          deb=(desktop-artifacts/**/*.deb)
          dmg=(desktop-artifacts/**/*.dmg)
          exe=(desktop-artifacts/**/*.exe)
          macos=(desktop-artifacts/**/*.app.tar.gz)
          sig=(desktop-artifacts/**/*.sig)
          if [ ${#deb[@]} -eq 0 ] || [ ${#dmg[@]} -eq 0 ] || [ ${#exe[@]} -eq 0 ]; then
            find desktop-artifacts -type f
            exit 1
          fi
          if [ ${#macos[@]} -eq 0 ] || [ ${#sig[@]} -lt 3 ]; then
            find desktop-artifacts -type f
            exit 1
          fi
          bun apps/desktop/scripts/updater-release.ts manifest desktop-artifacts \
            "$GITHUB_REPOSITORY" "$tag" "$version"
          {
            printf '%s\n' "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: groam-release-${{ github.run_id }}
          if-no-files-found: error
          path: |
            desktop-artifacts/**/*.deb
            desktop-artifacts/**/*.dmg
            desktop-artifacts/**/*.exe
            desktop-artifacts/**/*.app.tar.gz
            desktop-artifacts/**/*.sig
            desktop-artifacts/latest.json

  publish:
    name: Create GitHub Release
    needs: [prepare]
    if: github.event_name != 'push'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: groam-release-*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(
            release-assets/**/*.deb
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-assets/**/*.app.tar.gz
            release-assets/**/*.sig
            release-assets/**/latest.json
          )
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Groam ${TAG}" \
            --generate-notes \
            --notes "Download the installer for your platform, or let an installed copy update itself on launch." \
            --target "$SHA"
