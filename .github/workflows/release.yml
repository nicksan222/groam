name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "release" to confirm publication
        required: true
        type: string
      run_id:
        description: Successful CI run ID whose groam-desktop-* artifacts to publish
        required: true
        type: string
      target_sha:
        description: Git SHA that produced those artifacts
        required: true
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Create GitHub Release
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Validate release request
        env:
          CONFIRM: ${{ inputs.confirm }}
          RUN_ID: ${{ inputs.run_id }}
          SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "release" ]; then
            echo '::error::Type "release" in the confirmation input to publish a release.'
            exit 1
          fi
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]] || [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::run_id must be numeric and target_sha must be a full 40-character Git SHA.'
            exit 1
          fi
          if [ -z "$SIGNING_PRIVATE_KEY" ]; then
            echo '::error::TAURI_SIGNING_PRIVATE_KEY is not configured; refusing to publish unsigned updater artifacts.'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'

      - name: Verify manual release source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          head_sha="$(printf '%s' "$meta" | jq -r .head_sha)"
          event="$(printf '%s' "$meta" | jq -r .event)"
          branch="$(printf '%s' "$meta" | jq -r .head_branch)"
          conclusion="$(printf '%s' "$meta" | jq -r .conclusion)"
          if [ "$conclusion" != "success" ] || [ "$event" != "push" ] || [ "$branch" != "main" ] || [ "$head_sha" != "$TARGET_SHA" ]; then
            echo "Manual release requires a successful main push CI run whose head SHA matches target_sha"
            echo "run=$RUN_ID event=$event branch=$branch conclusion=$conclusion head=$head_sha target=$TARGET_SHA"
            exit 1
          fi

      - name: Download desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: desktop-artifacts
          pattern: groam-desktop-*
          run-id: ${{ inputs.run_id }}

      - name: Prepare release assets
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          version="$(tr -d '[:space:]' < desktop-artifacts/desktop-version.txt)"
          tag="v${version}"
          deb=(desktop-artifacts/**/*.deb)
          dmg=(desktop-artifacts/**/*.dmg)
          exe=(desktop-artifacts/**/*.exe)
          appimage=(desktop-artifacts/**/*.AppImage)
          macos=(desktop-artifacts/**/*.app.tar.gz)
          sig=(desktop-artifacts/**/*.sig)
          if [ ${#deb[@]} -eq 0 ] || [ ${#dmg[@]} -eq 0 ] || [ ${#exe[@]} -eq 0 ]; then
            find desktop-artifacts -type f
            exit 1
          fi
          if [ ${#appimage[@]} -eq 0 ] || [ ${#macos[@]} -eq 0 ] || [ ${#sig[@]} -lt 3 ]; then
            find desktop-artifacts -type f
            exit 1
          fi
          bun apps/desktop/scripts/updater-release.ts manifest desktop-artifacts \
            "$GITHUB_REPOSITORY" "$tag" "$version"
          {
            printf '%s\n' "tag=$tag"
            printf '%s\n' "version=$version"
            printf '%s\n' 'files<<RELEASE_ASSETS'
            printf '%s\n' "${deb[@]}" "${dmg[@]}" "${exe[@]}" "${appimage[@]}" "${macos[@]}" "${sig[@]}" \
              desktop-artifacts/latest.json
            printf '%s\n' 'RELEASE_ASSETS'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          FILES: ${{ steps.prep.outputs.files }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.target_sha }}
          TAG: ${{ steps.prep.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files <<< "$FILES"
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Groam ${TAG}" \
            --notes "Download the installer for your platform, or let an installed copy update itself on launch." \
            --target "$SHA"
