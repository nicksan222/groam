name: 🚀 Release main

# Reruns Checks and the full release (production) for current main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Checks
    uses: ./.github/workflows/test-reusable.yml

  release:
    name: 🚀 Release
    needs: [test]
    if: >-
      github.repository == 'nicksan222/groam' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml
    secrets: inherit
