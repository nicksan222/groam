name: 🚀 Release Production

on:
  workflow_call:
    secrets:
      CONVEX_DEPLOY_KEY:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  release:
    name: 🚀 Release production
    if: >-
      github.repository == 'nicksan222/groam' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.CONVEX_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GROAM_ENVIRONMENT: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    environment:
      name: prod
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify revision is still current main
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [ -z "$remote_main" ] || [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing to deploy because $GITHUB_SHA is no longer current main ($remote_main)."
            exit 1
          fi

      # Deploys Convex, then `void deploy` builds and publishes the web app and the landing site,
      # each as its own Void project. Void checks every new version before it takes traffic.
      - name: 🚀 Deploy production release
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy:production

