name: Run Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to migrate
        required: true
        type: choice
        options:
          - beta
          - prod
        default: beta

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Run ${{ inputs.environment }} migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Select Convex environment
        uses: ./.github/actions/setup-convex-target
        with:
          access-token: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          environment: ${{ inputs.environment }}
          scope: migrations

      - name: Run pending migrations
        run: bun run migrations:run

      - name: Show migration status
        run: bunx convex run --component migrations lib:getStatus

      - name: Revoke deploy key
        if: always()
        uses: ./.github/actions/cleanup-convex-target
        with:
          access-token: ${{ secrets.CONVEX_ACCESS_TOKEN }}
