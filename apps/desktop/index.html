<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./groam-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Groam</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: 'Google Sans Flex Variable', ui-sans-serif, system-ui, sans-serif;
      }

      body {
        background: rgb(15 23 42);
        color: rgb(226 232 240);
        display: grid;
        height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }

      .mark {
        display: block;
        height: 3rem;
        margin: 0 auto 1.25rem;
        width: 3rem;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }

      p {
        margin: 0;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="./groam-mark.svg" alt="" />
      <h1>Starting Groam</h1>
      <p>The local workspace is booting. This window will open the app automatically.</p>
    </main>
  </body>
</html>
