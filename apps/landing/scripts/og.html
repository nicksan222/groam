<!doctype html>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Google Sans Flex';
    src: url('FONT_URL') format('woff2');
    font-weight: 100 1000;
  }
  :root {
    --frame: #2a6fdb;
    --signal: #7dcfff;
    --ink: #2b2e38;
    --paper: #ffffff;
    --canvas: #f4f6fa;
    --line: #dde2ec;
    --muted: #5d6475;
  }
  * {
    box-sizing: border-box;
    margin: 0;
  }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--canvas);
    color: var(--ink);
    font-family: 'Google Sans Flex', sans-serif;
    display: grid;
    grid-template-columns: 500px 1fr;
    gap: 56px;
    padding: 72px 72px 72px 80px;
    align-items: center;
  }
  .brand {
    display: grid;
    gap: 28px;
  }
  .mark {
    width: 104px;
    height: 104px;
  }
  h1 {
    font-size: 104px;
    font-weight: 650;
    letter-spacing: -0.045em;
    line-height: 0.95;
  }
  p {
    font-size: 40px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: var(--muted);
  }
  .card {
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 28px;
    padding: 30px 32px 12px;
    box-shadow: 0 24px 48px -28px rgba(43, 46, 56, 0.35);
  }
  .label {
    font-size: 22px;
    font-weight: 600;
    color: var(--muted);
    padding-bottom: 14px;
    border-bottom: 2px solid var(--line);
  }
  .row {
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 18px;
    align-items: center;
    padding: 20px 0;
    border-bottom: 2px solid var(--line);
  }
  .row:last-child {
    border-bottom: 0;
  }
  .av {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 22px;
    font-weight: 650;
    color: var(--ink);
  }
  .row b {
    display: block;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .row span {
    display: block;
    font-size: 21px;
    color: var(--muted);
    margin-top: 3px;
  }
  .c-pink {
    background: #f3c6d8;
  }
  .c-green {
    background: #bfe5cf;
  }
  .c-peach {
    background: #f6d2b4;
  }
  .c-sky {
    background: var(--signal);
  }
  .c-mauve {
    background: #d9cdf0;
  }
  .time {
    font:
      600 20px/1 'Google Sans Flex',
      sans-serif;
    color: var(--frame);
    width: 70px;
  }
  .plan {
    display: grid;
    grid-template-columns: 70px 1fr;
    gap: 16px;
    align-items: center;
    padding: 15px 0;
    border-bottom: 2px solid var(--line);
    font-size: 24px;
    font-weight: 600;
  }
  .plan:last-child {
    border-bottom: 0;
  }
  .plan.add {
    color: #1f7a4d;
  }
  .plan.del {
    color: var(--muted);
    text-decoration: line-through;
  }
  .bubble {
    margin: 14px 0;
    padding: 16px 20px;
    border-radius: 22px;
    background: var(--canvas);
    font-size: 24px;
    line-height: 1.3;
    max-width: 88%;
  }
  .bubble b {
    display: block;
    font-size: 18px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .bubble.me {
    margin-left: auto;
    background: var(--frame);
    color: #fff;
  }
  .bubble.me b {
    color: #dbe7fb;
  }
  .big {
    font-size: 64px;
    font-weight: 650;
    letter-spacing: -0.03em;
  }
  .price {
    display: flex;
    gap: 28px;
    align-items: baseline;
    padding: 22px 0 10px;
  }
  .price span {
    font-size: 22px;
    color: var(--muted);
  }
  .faces {
    display: flex;
    gap: 10px;
    padding: 14px 0 18px;
  }
  .done {
    color: #1f7a4d;
    font-weight: 650;
    font-size: 20px;
  }
</style>
<body>
  <div class="brand">
    <svg class="mark" viewBox="0 0 64 64" fill="none">
      <defs>
        <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
          <rect width="64" height="64" fill="#fff" />
          <path
            d="M26 47.5C21.6 42 15 34.3 15 25.5A11 11 0 1 1 37 25.5C37 34.3 30.4 42 26 47.5Z"
            fill="#000"
            stroke="#000"
            stroke-width="7"
            stroke-linejoin="round"
          />
        </mask>
      </defs>
      <rect width="64" height="64" rx="15" fill="var(--frame)" />
      <path
        d="M39 49.5C35 44.5 29 37.5 29 29.5A10 10 0 1 1 49 29.5C49 37.5 43 44.5 39 49.5Z"
        fill="var(--signal)"
        mask="url(#gap)"
      />
      <path
        d="M26 47.5C21.6 42 15 34.3 15 25.5A11 11 0 1 1 37 25.5C37 34.3 30.4 42 26 47.5ZM22 25.5A4 4 0 1 0 30 25.5A4 4 0 1 0 22 25.5Z"
        fill="#fff"
        fill-rule="evenodd"
      />
    </svg>
    <h1>Groam</h1>
    <p>HEADLINE</p>
  </div>
  <div class="card">PANEL</div>
</body>
